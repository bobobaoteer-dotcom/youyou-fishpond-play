<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#79b83d"><meta name="description" content="从一级鱼塘开始，放养小鱼、做任务、领点券，邀请好友来串门。每位试玩者都有独立进度。"><title>悠悠鱼塘 · 一起来养鱼</title><link rel="icon" href="./game-assets/fish.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7eb83d;font-family:'PingFang SC','Microsoft YaHei',sans-serif}body{display:grid;place-items:center}.play-stage{position:relative;width:min(100vw,calc(100dvh * 390 / 844));height:min(100dvh,calc(100vw * 844 / 390));touch-action:none}canvas{width:100%;height:100%;display:block}.controls{position:absolute;inset:0;pointer-events:none}.controls button{position:absolute;opacity:0;pointer-events:auto;border:0;padding:0;cursor:pointer}.controls button:focus-visible{opacity:1;background:#fff1d5;color:#634029;border:2px solid #a27b41;border-radius:10px}.entry-layer{display:none;position:fixed;inset:0;background:#1e271b80;align-items:center;justify-content:center;z-index:20;padding:24px}.entry-layer.open{display:flex}.entry-panel{width:min(340px,100%);padding:24px;background:#fff3db;border:2px solid #bb8e55;border-radius:22px;color:#6d4829}.entry-panel h2{margin:0 0 16px;font-size:20px}.entry-panel input{width:100%;font:inherit;padding:12px;border:1px solid #cfb48c;border-radius:10px;background:#fffcf4}.entry-actions{display:flex;gap:12px;margin-top:16px}.entry-actions button{flex:1;border:0;padding:12px;border-radius:10px;background:#7fa43c;color:white;font:inherit}.entry-actions button:last-child{background:#c39c71}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff9e8;font-size:17px;pointer-events:none}
</style></head>
<body><main class="play-stage" aria-label="悠悠鱼塘"><canvas aria-label="鱼塘游戏场景"></canvas><div class="controls"></div><div class="loading">正在打开你的鱼塘…</div></main>
<div class="entry-layer" role="dialog" aria-modal="true" aria-labelledby="entry-title"><form class="entry-panel"><h2 id="entry-title"></h2><input aria-label="输入内容" autocomplete="off"><div class="entry-actions"><button type="submit">确认</button><button type="button" id="entry-cancel">取消</button></div></form></div>
<script defer src="./game.bundle.js?v=3"></script></body></html>
